project_id = "saascan"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Le parcours ne crée aucun compte : le serveur accède à la base avec service_role.
[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
